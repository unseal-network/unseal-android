name: Build signed Play release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag and GitHub Release name, for example v26.06.1
        required: true
        type: string
      release_name:
        description: Optional GitHub Release title. Defaults to tag_name.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  play-release:
    name: Build signed GPlay release and create GitHub Release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('play-release-{0}', github.event_name == 'push' && github.ref_name || inputs.tag_name) }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Validate release inputs and secrets
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "::error::Tag ${TAG_NAME} already exists."
            exit 1
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG_NAME} already exists."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-upload-keystore.jks"

      - name: Build signed GPlay release
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/android-upload-keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
          ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
          ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
          ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
          ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
          ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
          ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}
        run: ./gradlew bundleGplayRelease assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Prepare release files
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p release

          cp app/build/outputs/bundle/gplayRelease/app-gplay-release.aab "release/unseal-android-${version}-gplay-release.aab"
          find app/build/outputs/apk/gplay/release -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            cp "${apk}" "release/unseal-android-${version}-$(basename "${apk}")"
          done

          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unseal-android-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}-signed-gplay
          path: release/*

      - name: Create GitHub Release
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          RELEASE_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.release_name }}
          PRERELEASE: ${{ github.event_name == 'push' && 'true' || inputs.prerelease }}
        run: |
          set -euo pipefail
          title="${RELEASE_NAME:-${TAG_NAME}}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          cat > "${notes_file}" <<EOF
          Signed GPlay release built by GitHub Actions.

          Upload the AAB file to Google Play Console when creating the Play release.
          APK files are attached for installation and smoke testing outside Google Play.
          EOF

          args=()
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${TAG_NAME}" release/* \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file "${notes_file}" \
            "${args[@]}"
