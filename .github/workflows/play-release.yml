name: Publish Google Play release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to publish, for example v26.06.26
        required: true
        type: string
      track:
        description: Google Play track.
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Google Play release status.
        required: true
        default: draft
        type: choice
        options:
          - draft
          - inProgress
          - completed

permissions:
  contents: read
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish-google-play:
    name: Publish existing GitHub Release AAB to Google Play
    runs-on: ubuntu-latest
    environment: google-play
    concurrency:
      group: ${{ format('google-play-{0}-{1}', inputs.track, inputs.tag_name) }}
      cancel-in-progress: false
    steps:
      - name: Validate release and secrets
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail

          for name in GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

          if [[ "${GOOGLE_WORKLOAD_IDENTITY_PROVIDER}" != projects/*/locations/global/workloadIdentityPools/*/providers/* ]]; then
            echo "::error::GOOGLE_WORKLOAD_IDENTITY_PROVIDER must be the full provider resource name."
            exit 1
          fi

          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG_NAME} does not exist. Run Create GitHub release first."
            exit 1
          fi

      - name: Download release AAB
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p play-release
          gh release download "${TAG_NAME}" --pattern '*gplay-release.aab' --dir play-release

          count="$(find play-release -maxdepth 1 -name '*.aab' | wc -l | tr -d ' ')"
          if [ "${count}" != "1" ]; then
            echo "::error::Expected exactly one AAB asset in ${TAG_NAME}, found ${count}."
            find play-release -maxdepth 1 -type f -print
            exit 1
          fi

          mv play-release/*.aab play-release/app-gplay-release.aab

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: network.unseal
          releaseFiles: play-release/app-gplay-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
