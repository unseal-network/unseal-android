name: Build signed Play release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag and GitHub Release name, for example v26.06.1
        required: true
        type: string
      release_name:
        description: Optional GitHub Release title. Defaults to tag_name.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  play-release:
    name: Build signed GPlay release and create GitHub Release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('play-release-{0}', github.event_name == 'push' && github.ref_name || inputs.tag_name) }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Validate release inputs and secrets
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "::error::Tag ${TAG_NAME} already exists."
            exit 1
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG_NAME} already exists."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-upload-keystore.jks"

      - name: Build signed GPlay app bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/android-upload-keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
          ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
          ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
          ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
          ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
          ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
          ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}
        run: ./gradlew bundleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Build signed GPlay APKs
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/android-upload-keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
          ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
          ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
          ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
          ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
          ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
          ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}
        run: ./gradlew assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Prepare release files
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p release

          cp app/build/outputs/bundle/gplayRelease/app-gplay-release.aab \
            "release/unseal-android-${version}-play-store.aab"

          expected_apks=(
            "app-gplay-arm64-v8a-release.apk"
            "app-gplay-armeabi-v7a-release.apk"
            "app-gplay-x86_64-release.apk"
            "app-gplay-x86-release.apk"
            "app-gplay-universal-release.apk"
          )

          for source_name in "${expected_apks[@]}"; do
            source_path="app/build/outputs/apk/gplay/release/${source_name}"
            if [ ! -f "${source_path}" ]; then
              echo "::error::Missing expected release APK: ${source_path}"
              exit 1
            fi
            case "${source_name}" in
              app-gplay-arm64-v8a-release.apk) target_name="android-arm64-v8a.apk" ;;
              app-gplay-armeabi-v7a-release.apk) target_name="android-armeabi-v7a.apk" ;;
              app-gplay-x86_64-release.apk) target_name="android-x86_64.apk" ;;
              app-gplay-x86-release.apk) target_name="android-x86.apk" ;;
              app-gplay-universal-release.apk) target_name="android-universal-fallback.apk" ;;
              *)
                echo "::error::Unexpected release APK: ${source_name}"
                exit 1
                ;;
            esac
            cp "${source_path}" "release/unseal-android-${version}-${target_name}"
          done

          cat > release/DOWNLOADS.md <<EOF
          # Unseal Android ${version}

          ## Google Play

          Upload \`unseal-android-${version}-play-store.aab\` to Google Play Console.
          Google Play will keep the full app functionality and deliver only the APK splits needed by each device.

          ## Direct APK downloads

          These APKs are complete app builds. They differ only by CPU architecture.

          - \`unseal-android-${version}-android-arm64-v8a.apk\`: recommended for most modern Android phones.
          - \`unseal-android-${version}-android-armeabi-v7a.apk\`: for older 32-bit ARM Android devices.
          - \`unseal-android-${version}-android-x86_64.apk\`: for x86_64 emulators and devices.
          - \`unseal-android-${version}-android-x86.apk\`: for legacy x86 emulators and devices.
          - \`unseal-android-${version}-android-universal-fallback.apk\`: contains every ABI and is much larger; use only when the device architecture is unknown.

          Prefer the ABI-specific APKs for direct downloads. Do not publish the universal APK as the primary download.
          EOF

          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unseal-android-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}-signed-gplay
          path: release/*

      - name: Create GitHub Release
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          RELEASE_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.release_name }}
          PRERELEASE: ${{ github.event_name == 'push' && 'true' || inputs.prerelease }}
        run: |
          set -euo pipefail
          title="${RELEASE_NAME:-${TAG_NAME}}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          cat > "${notes_file}" <<EOF
          Signed GPlay release built by GitHub Actions.

          Upload the AAB file to Google Play Console when creating the Play release.
          ABI-specific APK files are attached for full-feature direct installation outside Google Play.
          Use arm64-v8a for most Android phones; use the universal fallback only when the device architecture is unknown.
          EOF

          args=()
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${TAG_NAME}" release/* \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file "${notes_file}" \
            "${args[@]}"

      - name: Notify Synapse download catalog
        env:
          WEBHOOK_URL: ${{ vars.SYNAPSE_DOWNLOAD_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SYNAPSE_DOWNLOAD_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_SECRET}" ]; then
            echo "::error::Missing SYNAPSE_DOWNLOAD_WEBHOOK_URL or SYNAPSE_DOWNLOAD_WEBHOOK_SECRET"
            exit 1
          fi

          body=$(jq -nc --arg repo "${GITHUB_REPOSITORY}" '{action:"published", repository:{full_name:$repo}}')
          signature=$(BODY="${body}" SECRET="${WEBHOOK_SECRET}" python3 - <<'PY'
          import hashlib
          import hmac
          import os

          print("sha256=" + hmac.new(os.environ["SECRET"].encode(), os.environ["BODY"].encode(), hashlib.sha256).hexdigest())
          PY
          )

          curl --fail-with-body -sS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-GitHub-Delivery: ${GITHUB_REPOSITORY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "X-Hub-Signature-256: ${signature}" \
            --data "${body}"

  publish-google-play:
    name: Publish signed AAB to Google Play internal track
    needs: play-release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ format('publish-google-play-{0}-internal', github.ref_name) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Google Play publish secrets
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail

          for name in GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Download signed release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unseal-android-${{ github.ref_name }}-signed-gplay
          path: release

      - name: Locate Play app bundle
        id: locate-aab
        run: |
          set -euo pipefail

          mapfile -t bundles < <(find release -type f -name '*play-store.aab' | sort)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one *play-store.aab asset in the release artifact, found ${#bundles[@]}."
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi

          echo "bundle_path=${bundles[0]}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Publish internal release to Google Play
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          TAG_NAME: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.locate-aab.outputs.bundle_path }}
        run: |
          set -euo pipefail

          python3 tools/release/publish_google_play.py \
            --package-name network.unseal \
            --bundle "${BUNDLE_PATH}" \
            --track internal \
            --release-name "${TAG_NAME}" \
            --status completed \
            --release-notes-dir fastlane/metadata/android/en-US/changelogs \
            --release-notes-language en-US \
            --changes-in-review-behavior ERROR_IF_IN_REVIEW
